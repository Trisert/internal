<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>J2050 Team Management – Create account</title>
  <script>
    // Apply the saved theme before the first paint (key documented in js/theme.js).
    try {
      const saved = localStorage.getItem('j2050-theme');
      document.documentElement.dataset.theme =
        saved === 'dark' || saved === 'light' ? saved
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch {
      document.documentElement.dataset.theme =
        matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/theme.js"></script>
</head>
<body class="login-page">
  <main class="login-box">
    <div class="auth-brand">
      <span class="brand-logo" role="img" aria-label="J2050">
        <img class="logo-on-light" src="img/j2050-logo-light.png" width="239" height="88" alt="">
        <img class="logo-on-dark" src="img/j2050-logo-dark.png" width="241" height="88" alt="">
      </span>
      <span class="brand-sub">University of Padova</span>
    </div>
    <h1>Create account</h1>
    <form id="register-form" novalidate>
      <p class="hint">Use your @studenti.unipd.it or @unipd.it address.</p>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password (at least 12 characters)</label>
      <input id="password" type="password" autocomplete="new-password" required>
      <label for="password2">Repeat password</label>
      <input id="password2" type="password" autocomplete="new-password" required>
      <button id="register-btn" type="submit">Create account</button>
    </form>
    <p id="register-msg" class="message" role="alert" hidden></p>
    <p class="links"><a href="index.html">Back to login</a></p>
    <p class="auth-foot">Internal tool · Authorised members only</p>
  </main>

  <script type="module">
    import { supabase } from './js/config.js';
    import { isAllowedEmail, checkPassword, pageUrl, friendlyError, showMessage } from './js/auth.js';

    const form = document.getElementById('register-form');
    const msg = document.getElementById('register-msg');
    const button = document.getElementById('register-btn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      showMessage(msg, '');

      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      if (!isAllowedEmail(email)) {
        showMessage(msg, 'Only @studenti.unipd.it and @unipd.it addresses are allowed.');
        return;
      }
      const passwordError = checkPassword(password, password2);
      if (passwordError) { showMessage(msg, passwordError); return; }

      button.disabled = true;
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: { emailRedirectTo: pageUrl('index.html') },
      });

      if (error) {
        showMessage(msg, friendlyError(error));
        button.disabled = false;
        return;
      }

      // Existing confirmed account: Supabase returns a user without identities
      if (data.user && data.user.identities && data.user.identities.length === 0) {
        showMessage(msg, 'An account with this email already exists. Log in or reset the password.', 'info');
        button.disabled = false;
        return;
      }

      form.hidden = true;
      showMessage(
        msg,
        `A confirmation email has been sent to ${email}. Open the link in the email to complete ` +
        'the registration (check also the spam folder). After confirmation, an administrator ' +
        'will approve the account.',
        'success'
      );
    });
  </script>
</body>
</html>
