<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>J2050 Team Management – Forgot password</title>
  <script>
    // Apply the saved theme before the first paint (key documented in js/theme.js).
    try {
      const saved = localStorage.getItem('j2050-theme');
      document.documentElement.dataset.theme =
        saved === 'dark' || saved === 'light' ? saved
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch {
      document.documentElement.dataset.theme =
        matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/theme.js"></script>
</head>
<body class="login-page">
  <main class="login-box">
    <div class="auth-brand">
      <span class="brand-logo" role="img" aria-label="J2050">
        <img class="logo-on-light" src="img/j2050-logo-light.png" width="239" height="88" alt="">
        <img class="logo-on-dark" src="img/j2050-logo-dark.png" width="241" height="88" alt="">
      </span>
      <span class="brand-sub">University of Padova</span>
    </div>
    <h1>Forgot password</h1>
    <form id="forgot-form" novalidate>
      <p class="hint">A link to set a new password will be sent to this address.</p>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <button id="forgot-btn" type="submit">Send link</button>
    </form>
    <p id="forgot-msg" class="message" role="alert" hidden></p>
    <p class="links"><a href="index.html">Back to login</a></p>
    <p class="auth-foot">Internal tool · Authorised members only</p>
  </main>

  <script type="module">
    import { supabase } from './js/config.js';
    import { pageUrl, friendlyError, showMessage } from './js/auth.js';

    const form = document.getElementById('forgot-form');
    const msg = document.getElementById('forgot-msg');
    const button = document.getElementById('forgot-btn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      if (!email) { showMessage(msg, 'Enter your email.'); return; }

      button.disabled = true;
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: pageUrl('reset.html'),
      });
      button.disabled = false;

      if (error) { showMessage(msg, friendlyError(error)); return; }
      form.hidden = true;
      showMessage(
        msg,
        'If an account exists for this address, an email with a link to set a new password ' +
        'has been sent (check also the spam folder).',
        'success'
      );
    });
  </script>
</body>
</html>
